# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_sanshain-js
# Analysed by .github/workflows/sonar.yml on pushes to summer; Automatic
# Analysis is off in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_sanshain-js
sonar.projectName=sanshain-js

# The TypeScript sources, the CLI entry and the Action; dist/ is built output.
sonar.sources=src,bin,action.yml
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Coverage: the workflow's jest --coverage run.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Accepted findings, each limited to its rule and its single file, so a new
# file with the same finding is still reported.
sonar.issue.ignore.multicriteria=tokenurl,instance,configfile,namedfiles

# The token travels only in the Authorization header (tests/api.test.ts checks
# it over real HTTP); the URL is the instance the user names, and the require
# query carries the names, pin, stream, format and annotations api.yaml defines.
sonar.issue.ignore.multicriteria.tokenurl.ruleKey=tssecurity:S8690
sonar.issue.ignore.multicriteria.tokenurl.resourceKey=src/api.ts
# The client calls the Sanshain instance the user names with --url,
# SANSHAIN_URL or sanshainUrl; calling it is the tool's purpose.
sonar.issue.ignore.multicriteria.instance.ruleKey=tssecurity:S8703
sonar.issue.ignore.multicriteria.instance.resourceKey=src/api.ts
# A CLI reading the sanshain.yaml the user names with --config, and the spec,
# catalogInfo and output paths that file names, relative to it.
sonar.issue.ignore.multicriteria.configfile.ruleKey=tssecurity:S8707
sonar.issue.ignore.multicriteria.configfile.resourceKey=src/config.ts
sonar.issue.ignore.multicriteria.namedfiles.ruleKey=tssecurity:S8707
sonar.issue.ignore.multicriteria.namedfiles.resourceKey=src/cli.ts
