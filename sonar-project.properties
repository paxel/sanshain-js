# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_sanshain-js
# Analysed by the sonar job of .github/workflows/ci.yml (paxel/gates sonar.yml) on pull requests
# and on summer; Automatic Analysis is off in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_sanshain-js
sonar.projectName=sanshain-js

# The TypeScript sources, the CLI entry, the Action and the workflows; dist/ is
# built output.
sonar.sources=src,bin,action.yml,.github
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Coverage: the shared TypeScript gate runs the tests with coverage and keeps coverage/ts.lcov,
# which the sonar job downloads.
sonar.javascript.lcov.reportPaths=coverage/ts.lcov
