# CodeQL code scanning, advanced setup so it is versioned here: the client's
# TypeScript and JavaScript and the workflows themselves (with the Action's
# action.yml), on every push and pull request and weekly, because new queries
# appear without any change in this repo. The alerts show under Security ▸
# Code scanning. Settings ▸ Code security ▸ Code scanning ▸ Default setup
# stays off: it cannot run beside this workflow.
#
# Third-party actions are pinned to full commit SHAs; the comment names the
# version.
name: CodeQL

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dist is tsc's output of src (analysed there), node_modules upstream's code.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - dist
              - node_modules

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
