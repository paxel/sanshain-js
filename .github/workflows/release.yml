# Release on tag: `git tag v2.3.0 && git push origin v2.3.0` produces the
# GitHub Release and the npm publish.
#
# npm auth is Trusted Publishing (OIDC): no NPM_TOKEN — the `id-token`
# permission plus a trusted-publisher entry on the npm package pointing at this
# repository and this workflow file. Requires npm >= 11.5.1 and Node >= 22.14
# (Node 24 bundles a new enough npm). The first publish of the name happens
# manually, so the package exists to configure the publisher on.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      # The mistake a hand-cut tag makes: tagging v2.4.0 without bumping the
      # manifest. npm publishes what package.json says, so the tag would name
      # a version nobody can install.
      - name: Tag matches the package version
        run: |
          ver=$(node -p "require('./package.json').version")
          tag=${GITHUB_REF_NAME#v}
          [ "$ver" = "$tag" ] || { echo "tag v$tag != package version $ver" >&2; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: npm test

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      # An npm version is immutable — republishing is a hard error, so a re-run
      # (or a tag after the manual first publish) must skip what already landed.
      - name: Publish to npm (trusted publishing, skipping published versions)
        run: |
          ver=$(node -p "require('./package.json').version")
          if npm view "sanshain@${ver}" version >/dev/null 2>&1; then
            echo "sanshain@${ver} already on npm — skipping"
          else
            npm publish
          fi
