# Fails only when a dependency has a known vulnerability (npm advisories). Runs weekly and
# on demand, because new advisories appear without any change in this repo.
# Warnings such as unmaintained or yanked packages are reported but never fail it.
name: Security

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: Vulnerable npm packages (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm audit
        run: npm audit
