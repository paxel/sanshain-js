# Fails only when a dependency has a known vulnerability (npm advisories). Runs weekly and
# on demand, because new advisories appear without any change in this repo.
# Warnings such as unmaintained or yanked packages are reported but never fail it.
name: Security

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: Vulnerable npm packages (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: npm audit
        run: npm audit
