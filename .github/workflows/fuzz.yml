name: Fuzz

# The Jazzer.js targets in fuzz/, weekly and by hand, from paxel/gates: what the client reads
# but did not write. config is sanshain.yaml, annotations is the filling of the placeholders
# in annotation values, response is the body and the warning headers of an answer of the
# service, state is the require state file. The targets load the built package, so the
# workflow builds it first. A crash fails the job and leaves its input as a crash-* file in
# the job's artifact; `npx jazzer fuzz/<target>.fuzz.js <that file>` replays it.
on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    uses: paxel/gates/.github/workflows/fuzz.yml@66ed2d3a448a5f6bfa1794809b330eb9fbee01ba # v1.2.0
    with:
      stack: ts
      prepare: npm run build
      targets: |
        fuzz/config.fuzz.js
        fuzz/annotations.fuzz.js
        fuzz/response.fuzz.js
        fuzz/state.fuzz.js
