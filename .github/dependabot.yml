# Dependency updates: one grouped pull request per ecosystem and week.
# A release is proposed only after it has been out for 14 days (cooldown),
# so early fixes are in; security updates are not held back.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 waits until ts-jest accepts it (its peer range ends below 7).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The types describe the oldest Node the client supports (engines): 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    groups:
      githubactions:
        patterns: ["*"]
