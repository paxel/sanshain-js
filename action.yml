name: 'Sanshain Action'
description: 'Manage OpenAPI specs with Sanshain Service (Provide/Require)'
author: 'Patrick Zimmer'
inputs:
  command:
    description: 'The command to execute: provide, require or catalog (catalog pushes the catalogInfo file and needs Sanshain Service 2.4.0)'
    required: true
  token:
    description: 'Sanshain API token (optional if set via SANSHAIN_TOKEN secret)'
    required: false
  ga:
    description: 'Set to "true" to provide as immutable GA instead of the default snapshot (maps to SANSHAIN_GA). Typically set on protected-branch pipelines. Leave it empty to let autoGa in sanshain.yaml decide; "false" keeps a snapshot even then.'
    required: false
    default: ''
  trunk:
    description: 'Set to "true" on trunk CI: this build maintains the main graph (maps to SANSHAIN_TRUNK). Leave it empty to keep a SANSHAIN_TRUNK set on the job or workflow.'
    required: false
    default: ''
  tag:
    description: 'A sanshain-branch name for release/hotfix pipelines (maps to SANSHAIN_TAG). Mutually exclusive with trunk: setting both records the build in neither, with a warning (fails under SANSHAIN_STRICT).'
    required: false
    default: ''
  tickets:
    description: 'Ticket ids this build closes, comma-separated (maps to SANSHAIN_TICKETS); stored with the version as part of its origin. The build and pull request URLs are taken from the workflow run on their own.'
    required: false
    default: ''
  note:
    description: 'One line of intent for this provide (maps to SANSHAIN_NOTE).'
    required: false
    default: ''
  working-directory:
    description: 'Directory where sanshain.yaml is located'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Run Sanshain CLI
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # An empty input keeps the variable the job or workflow set.
      env:
        SANSHAIN_TOKEN: ${{ inputs.token || env.SANSHAIN_TOKEN }}
        SANSHAIN_GA: ${{ inputs.ga || env.SANSHAIN_GA }}
        SANSHAIN_TRUNK: ${{ inputs.trunk || env.SANSHAIN_TRUNK }}
        SANSHAIN_TAG: ${{ inputs.tag || env.SANSHAIN_TAG }}
        SANSHAIN_TICKETS: ${{ inputs.tickets || env.SANSHAIN_TICKETS }}
        SANSHAIN_NOTE: ${{ inputs.note || env.SANSHAIN_NOTE }}
        # The command reaches bash as data, never as script text: split into words, no globbing.
        SANSHAIN_ACTION_COMMAND: ${{ inputs.command }}
      # A release that is on npm, so the code that runs is fixed by the Action's
      # ref and not by whatever npm has newest. Raised right after each publish
      # (release.yml); a project's own install is used only at this version.
      # No install scripts run while npx fetches it and its dependencies.
      run: |
        set -f
        npx --yes --ignore-scripts sanshain@2.7.0 $SANSHAIN_ACTION_COMMAND
